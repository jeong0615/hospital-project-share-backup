<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>의무기록부 조회 시스템</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #3b71ca; color: white; padding: 15px; font-size: 1.5em; font-weight: bold; }
        .search-bar { background-color: #fff; padding: 15px; border-bottom: 1px solid #ddd; }

        /* 상단 테이블 영역 */
        .list-container { flex: 1; overflow-y: auto; padding: 20px; background-color: #f8f9fa; }
        table { width: 100%; border-collapse: collapse; background: white; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #3b71ca; color: white; position: sticky; top: 0; }
        tr:hover { background-color: #e9ecef; }

        /* 하단 상세 정보 영역 */
        .detail-container { height: 250px; background-color: #2c5ba3; color: white; padding: 20px; box-sizing: border-box; }
        .detail-title { font-size: 1.2em; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 10px; }
        .detail-content { display: block; line-height: 1.6; }
    </style>
</head>
<body>

<div class="header">의무기록부 조회 시스템</div>
<div class="search-bar">
    <span style="font-weight: bold; color: #3b71ca; margin-right: 10px;">환자 검색:</span>
    <input type="text" id="searchInput" onkeyup="filterTable()"
           placeholder="검색(환자이름 또는 식별번호) 입력..."
           style="border: 1px solid #3b71ca; padding: 8px; width: 400px; border-radius: 4px;">
</div>

<div class="list-container">
    <table>
        <thead>
            <tr>
                <th>식별번호</th>
                <th>이름</th>
                <th>생일</th>
                <th>성별</th>
                <th>담당의 (최근)</th>
            </tr>
        </thead>
        <tbody id="patientTableBody">
            {% for p in patients %}
            <tr onclick="showDetail({{ p.patient_id }})">
                <td>{{ p.patient_id }}</td>
                <td>{{ p.name }}</td>
                <td>{{ p.birth_date }}</td>
                <td>{{ p.gender }}</td>
                <td>{{ p.doctor_name or '기록 없음' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<div class="detail-container" id="detail-box">
    <div class="detail-title" id="detail-header">환자 상세 정보 (환자를 선택하세요)</div>
    <div class="detail-content" id="detail-data">
        진료 기록을 보려면 목록에서 환자를 클릭하세요.
    </div>
</div>

<script>
// 실시간 검색 필터링 함수
function filterTable() {
    let input = document.getElementById('searchInput');
    let filter = input.value.toUpperCase();
    let tr = document.querySelectorAll("#patientTableBody tr");

    tr.forEach(row => {
        let tdId = row.getElementsByTagName("td")[0];   // ID 칸
        let tdName = row.getElementsByTagName("td")[1]; // 이름 칸

        if (tdId && tdName) {
            let txtValue = tdId.textContent + tdName.textContent;
            if (txtValue.toUpperCase().indexOf(filter) > -1) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
        }
    });
}

// 상세 정보 가져오기 함수
function showDetail(patientId) {
    fetch('/patient_details/' + patientId)
        .then(response => response.json())
        .then(data => {
            const detailBox = document.getElementById('detail-data');
            const detailHeader = document.getElementById('detail-header');

            if (data && !data.error) {
                detailHeader.innerText = `[${data.patient_name}] 환자의 최근 진료 정보`;
                detailBox.innerHTML = `
                    <div style="font-size:1.1em; line-height:1.8em;">
                        <strong>● 담당 의사:</strong> ${data.doctor_name} (${data.department}) <br>
                        <strong>● 최근 진료일:</strong> ${data.visit_date} <br>
                        <strong>● 진단 소견:</strong> <span style="color:#FFD700;">${data.diagnosis}</span>
                    </div>
                `;
            } else {
                detailHeader.innerText = "정보 없음";
                detailBox.innerHTML = `<div style='color:#ffcccc;'>${data.error || "데이터를 불러올 수 없습니다."}</div>`;
            }
        })
        .catch(err => {
            console.error("Error:", err);
            document.getElementById('detail-data').innerHTML = "서버 연결 오류가 발생했습니다.";
        });
}
</script>

</body>
</html>
