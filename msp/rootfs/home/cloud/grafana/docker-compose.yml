services:
  grafana:
    image: grafana/grafana-oss:11.2.2
    container_name: msp-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HTTP_PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - /home/cloud/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem:/etc/grafana/certs/wazuh-root-ca.pem:ro
    networks:
      - zabbix_default
      - single-node_default

networks:
  zabbix_default:
    external: true
  single-node_default:
    external: true
