[web_servers]
WEB_DR_HOST ansible_user=ubuntu ansible_ssh_private_key_file=/path/to/managed/ssh-key

[doc_servers]
DOC_DR_HOST ansible_user=ubuntu ansible_ssh_private_key_file=/path/to/managed/ssh-key

[db_servers]
DB_DR_HOST ansible_user=ubuntu ansible_ssh_private_key_file=/path/to/managed/ssh-key

# Replace host placeholders and key paths through a local, ignored inventory.ini.
# Do not commit public IPs, private IPs, private keys, or credentials.

