[web_servers]
dr-web ansible_connection=ssh ansible_host=dr-web ansible_user=ubuntu ansible_ssh_private_key_file=/home/cloud/.ssh/dr_key_v2 ansible_ssh_common_args='-F /var/lib/hospital-dr/ssh/config'

[doc_servers]
dr-doc ansible_connection=ssh ansible_host=dr-doc ansible_user=ubuntu ansible_ssh_private_key_file=/home/cloud/.ssh/dr_key_v2 ansible_ssh_common_args='-F /var/lib/hospital-dr/ssh/config'

[db_servers]
dr-db ansible_connection=ssh ansible_host=dr-db ansible_user=ubuntu ansible_ssh_private_key_file=/home/cloud/.ssh/dr_key_v2 ansible_ssh_common_args='-F /var/lib/hospital-dr/ssh/config'
