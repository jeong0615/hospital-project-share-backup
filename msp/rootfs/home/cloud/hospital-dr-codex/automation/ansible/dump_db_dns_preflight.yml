---
- name: Validate that the isolated Dump DNS preflight inventory is exact
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Refuse ambiguous or production DB/app inventory targets
      ansible.builtin.assert:
        that:
          - groups['web_servers'] | default([]) == ['dr-web']
          - groups['doc_servers'] | default([]) == ['dr-doc']
          - groups['db_servers'] | default([]) == ['dr-db']
          - groups['isolated_dump_restore'] | default([]) == ['isolated-dump-restore']
          - dump_dns_instance_id is match('^i-[0-9a-f]{8,17}$')
          - dump_dns_instance_id != 'AWS_RESOURCE_ID_REDACTED'
          - dump_dns_private_ip is match('^10[.]20[.]30[.](?:[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])$')
          - dump_dns_private_ip != 'IP_REDACTED'
          - dump_dns_private_ip != 'IP_REDACTED'
          - dump_dns_private_ip != 'IP_REDACTED'
          - dump_dns_private_ip != 'IP_REDACTED'
          - dump_dns_data_volume_id is match('^vol-[0-9a-f]{8,32}$')
          - dump_dns_stage_volume_id is match('^vol-[0-9a-f]{8,32}$')
          - dump_dns_data_volume_id != dump_dns_stage_volume_id
          - dump_dns_service_sg_id is match('^sg-[0-9a-f]{8,32}$')
          - dump_dns_backup_id is match('^db_backup_[0-9]{8}_[0-9]{4,6}[.]sql[.]gz[.]enc$')
          - dump_dns_expected_sha256 is match('^[0-9a-f]{64}$')
          - dump_dns_promotion_id is match('^[0-9a-f-]{36}$')
          - dump_dns_cutover_id is match('^[0-9a-f-]{36}$')
        fail_msg: Dump DNS preflight identity or inventory contract is invalid.

- name: Verify isolated DB receipts and current write fence using read-only queries
  hosts: isolated_dump_restore
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Inspect installed helper files without changing the isolated host
      ansible.builtin.stat:
        path: "{{ item.path }}"
        checksum_algorithm: sha256
      loop:
        - path: /usr/local/sbin/hospital-dr-isolated-db-service
          expected: "{{ dump_dns_expected_service_helper_sha256 }}"
        - path: /usr/local/sbin/isolated_restore_host.py
          expected: "{{ dump_dns_expected_restore_helper_sha256 }}"
      register: dump_dns_installed_helpers
      changed_when: false

    - name: Require exact reviewed helper versions before using their receipt verifier
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0750' or item.item.path.endswith('isolated_restore_host.py') and item.stat.mode == '0644'
          - item.stat.checksum == item.item.expected
      loop: "{{ dump_dns_installed_helpers.results }}"
      no_log: true

    - name: Verify restore, service, promotion, app-fence receipts and current MySQL fences
      ansible.builtin.command:
        argv:
          - python3
          - /usr/local/sbin/hospital-dr-isolated-db-service
          - verify-dump-dns-preflight
          - --instance-id
          - "{{ dump_dns_instance_id }}"
          - --private-ip
          - "{{ dump_dns_private_ip }}"
          - --data-volume-id
          - "{{ dump_dns_data_volume_id }}"
          - --stage-volume-id
          - "{{ dump_dns_stage_volume_id }}"
          - --expected-sha256
          - "{{ dump_dns_expected_sha256 }}"
          - --expected-backup-id
          - "{{ dump_dns_backup_id }}"
          - --promotion-id
          - "{{ dump_dns_promotion_id }}"
          - --cutover-id
          - "{{ dump_dns_cutover_id }}"
      register: dump_dns_db_receipt
      changed_when: false
      no_log: true
      failed_when: dump_dns_db_receipt.rc != 0

    - name: Parse the non-secret app container identities from the verified fence receipt
      ansible.builtin.set_fact:
        dump_dns_verified_db_receipt: "{{ dump_dns_db_receipt.stdout | from_json }}"
      no_log: true

- name: Verify Web and EMR remain stopped and disconnected from external traffic
  hosts: web_servers:doc_servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    dump_dns_app_kind: "{{ 'web' if 'web_servers' in group_names else 'emr' }}"
  tasks:
    - name: Run the transient read-only host fence probe
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../operations/db/dump_db_app_fence_probe.py
          --kind {{ dump_dns_app_kind }}
          --cutover-id {{ dump_dns_cutover_id }}
          --isolated-private-ip {{ dump_dns_private_ip }}
        executable: python3
      register: dump_dns_app_fence
      changed_when: false
      no_log: true

    - name: Parse the non-secret app fence result
      ansible.builtin.set_fact:
        dump_dns_verified_app_fence: "{{ dump_dns_app_fence.stdout | from_json }}"
      no_log: true

    - name: Match current stopped container to the exact promotion receipt
      ansible.builtin.assert:
        that:
          - dump_dns_verified_app_fence.stopped | bool
          - dump_dns_verified_app_fence.listener_absent | bool
          - dump_dns_verified_app_fence.app_health_checked == false
          - dump_dns_verified_app_fence.cutover_id == dump_dns_cutover_id
          - dump_dns_verified_app_fence.db_host == dump_dns_private_ip
          - dump_dns_verified_app_fence.db_port | int == 3307
          - dump_dns_verified_app_fence.restart_policy in ['unless-stopped', 'no']
          - dump_dns_verified_app_fence.restart_policy != 'no' or dump_dns_verified_app_fence.external_fence | bool
          - dump_dns_verified_app_fence.container_id == hostvars['isolated-dump-restore'].dump_dns_verified_db_receipt.apps[dump_dns_app_kind].container_id
        fail_msg: Current Web/EMR state differs from the recorded pre-DNS application fence.
      no_log: true

- name: Report that all read-only Dump DNS preflight checks passed
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Emit a non-authorizing preflight result
      ansible.builtin.debug:
        msg: DUMP_DNS_PREFLIGHT_REMOTE=PASS dns_authorized=false application_writes_allowed=false app_health_checked=false
