---
- name: Validate the Dump DB cutover inventory is exactly the two DR app hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Refuse missing or ambiguous Web/EMR inventory targets
      ansible.builtin.assert:
        that:
          - groups['web_servers'] | default([]) == ['dr-web']
          - groups['doc_servers'] | default([]) == ['dr-doc']
          - groups['db_servers'] | default([]) == ['dr-db']
        fail_msg: The app cutover inventory must map only the approved DR Web/EMR/DB SSH aliases.
      when: dump_db_service_cutover_phase != 'rollback'

- name: Snapshot, probe, switch, or restore only the DR Web and EMR app endpoints
  hosts: web_servers:doc_servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    dump_db_service_cutover_root: /var/lib/hospital-dr/db-endpoint-cutovers
    dump_db_service_app_kind: "{{ 'web' if 'web_servers' in group_names else 'emr' }}"
    dump_db_service_container: "{{ 'hospital-dr-web' if dump_db_service_app_kind == 'web' else 'hospital-dr-emr' }}"
    dump_db_service_env_file: >-
      {{ '/etc/hospital-dr/hospital-dr-web.env' if dump_db_service_app_kind == 'web'
         else '/etc/hospital-dr/hospital-dr-emr.env' }}
    dump_db_service_port: 3307
    dump_db_service_user: hospital_dr_service
    dump_db_service_name: hospital_db
    dump_db_service_probe_config_host: "/run/hospital-dr-db-probe-{{ dump_db_service_cutover_id }}.json"
    dump_db_service_probe_script_host: "/run/hospital-dr-db-probe-{{ dump_db_service_cutover_id }}.js"
  tasks:
    - name: Validate pre-DNS cutover contract
      ansible.builtin.assert:
        that:
          - dump_db_service_cutover_id is match('^[0-9a-f-]{36}$')
          - dump_db_service_instance_id is match('^i-[0-9a-f]{8,17}$')
          - dump_db_service_host is match('^10[.]20[.]30[.](?:[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])$')
          - dump_db_service_host != 'IP_REDACTED'
          - dump_db_service_port | int == 3307
          - dump_db_service_user == 'hospital_dr_service'
          - dump_db_service_expected_sha256 is match('^[0-9a-f]{64}$')
          - dump_db_service_password is defined
          - dump_db_service_password | length >= 32
        fail_msg: Isolated Dump DB endpoint or service-account contract is invalid.
      no_log: true
      when: dump_db_service_cutover_phase != 'rollback'

    - name: Select the requested controller phase
      ansible.builtin.assert:
        that:
          - dump_db_service_cutover_phase in ['snapshot-probe', 'switch', 'rollback']
        fail_msg: Unsupported Dump DB cutover phase.

    - name: Read-only snapshot and app-container connection probe
      when: dump_db_service_cutover_phase == 'snapshot-probe'
      block:
        - name: Inspect the existing app environment file without displaying contents
          ansible.builtin.stat:
            path: "{{ dump_db_service_env_file }}"
            follow: false
          register: dump_db_service_env_stat

        - name: Require an existing regular root-managed app environment file
          ansible.builtin.assert:
            that:
              - dump_db_service_env_stat.stat.exists
              - dump_db_service_env_stat.stat.isreg
              - not dump_db_service_env_stat.stat.islnk
              - dump_db_service_env_stat.stat.pw_name == 'root'
              - dump_db_service_env_stat.stat.mode == '0600'
            fail_msg: Existing app DB configuration is missing or does not have the protected expected ownership/mode.

        - name: Validate the existing endpoint and required env keys without printing their values
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import sys
                from pathlib import Path
                keys = ('DB_HOST', 'DB_PORT', 'DB_USER', 'DB_PASSWORD', 'DB_NAME')
                lines = Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
                values = {}
                for key in keys:
                    found = [line[len(key) + 1:] for line in lines if line.startswith(key + '=')]
                    if len(found) != 1 or not found[0]:
                        raise SystemExit(2)
                    values[key] = found[0]
                if values['DB_HOST'] != 'IP_REDACTED' or values['DB_PORT'] != '3306' or values['DB_NAME'] != 'hospital_db':
                    raise SystemExit(3)
                print('EXISTING_DB_CONFIG=VALID')
              - "{{ dump_db_service_env_file }}"
          register: dump_db_service_env_contract
          changed_when: false
          no_log: true
        - name: Inspect the current container contract without exposing its environment
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --format
              - "{% raw %}{{.Id}}|{{.Image}}|{{.State.Running}}|{{.HostConfig.RestartPolicy.Name}}|{{json .HostConfig.PortBindings}}|{{.State.Health.Status}}{% endraw %}"
              - "{{ dump_db_service_container }}"
          register: dump_db_service_container_inspect
          changed_when: false
          no_log: true
# EOF
        - name: Parse safe container metadata
          ansible.builtin.set_fact:
            dump_db_service_container_fields: "{{ dump_db_service_container_inspect.stdout.split('|') }}"
            dump_db_service_old_container: "{{ dump_db_service_container }}-dbcutover-{{ dump_db_service_cutover_id | replace('-', '') }}"
            dump_db_service_probe_image_id: "{{ dump_db_service_container_inspect.stdout.split('|')[1] }}"
          no_log: true

        - name: Require a healthy, running container with the managed loopback port contract
          ansible.builtin.assert:
            that:
              - dump_db_service_container_fields | length == 6
              - dump_db_service_container_fields[0] is match('^[0-9a-f]{64}$')
              - dump_db_service_container_fields[1] is match('^sha256:[0-9a-f]{64}$')
              - dump_db_service_container_fields[2] == 'true'
              - dump_db_service_container_fields[3] == 'unless-stopped'
              - (dump_db_service_container_fields[4] | from_json)['3000/tcp'][0]['HostIp'] == 'IP_REDACTED'
              - (dump_db_service_container_fields[4] | from_json)['3000/tcp'][0]['HostPort'] == '3000'
              - dump_db_service_container_fields[5] == 'healthy'
            fail_msg: Existing app container is not healthy or differs from the managed restart/port contract.
          no_log: true

        - name: Refuse a reused cutover ID or pre-existing rollback container
          ansible.builtin.command:
            argv:
              - docker
              - container
              - inspect
              - "{{ dump_db_service_old_container }}"
          register: dump_db_service_old_container_check
          changed_when: false
          failed_when: false
          no_log: true

        - name: Inspect the cutover backup directory
          ansible.builtin.stat:
            path: "{{ dump_db_service_cutover_root }}/{{ dump_db_service_cutover_id }}"
          register: dump_db_service_backup_dir_stat

        - name: Require a fresh, unique cutover backup location
          ansible.builtin.assert:
            that:
              - dump_db_service_old_container_check.rc != 0
              - not dump_db_service_backup_dir_stat.stat.exists
            fail_msg: Cutover ID already has a backup or rollback container; use a new unique ID.

        - name: Confirm app credential material will be staged only on tmpfs
          ansible.builtin.command:
            argv:
              - findmnt
              - -n
              - -o
              - FSTYPE
              - --target
              - /run
          register: dump_db_service_run_fstype
          changed_when: false

        - name: Refuse secret staging unless /run is tmpfs
          ansible.builtin.assert:
            that:
              - dump_db_service_run_fstype.stdout | trim == 'tmpfs'
            fail_msg: App DB probe credentials require a tmpfs /run filesystem.

        - name: Create a private persistent pre-DNS rollback directory
          ansible.builtin.file:
            path: "{{ dump_db_service_cutover_root }}/{{ dump_db_service_cutover_id }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Save the exact previous app env file with root-only access
          ansible.builtin.copy:
            src: "{{ dump_db_service_env_file }}"
            dest: "{{ dump_db_service_cutover_root }}/{{ dump_db_service_cutover_id }}/app.env.before"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Save non-secret container rollback metadata
          ansible.builtin.copy:
            dest: "{{ dump_db_service_cutover_root }}/{{ dump_db_service_cutover_id }}/container.json"
            content: "{{ {'container': dump_db_service_container, 'rollback_container': dump_db_service_old_container, 'container_id': dump_db_service_container_fields[0], 'image_id': dump_db_service_container_fields[1], 'was_running': true} | to_json }}\n"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Stage the read-only probe script on tmpfs
          ansible.builtin.copy:
            src: "{{ dump_db_service_probe_script }}"
            dest: "{{ dump_db_service_probe_script_host }}"
            owner: root
            group: root
            mode: "0600"

        - name: Stage the isolated DB service credential on tmpfs
          ansible.builtin.copy:
            dest: "{{ dump_db_service_probe_config_host }}"
            content: "{{ {'host': dump_db_service_host, 'port': dump_db_service_port | int, 'user': dump_db_service_user, 'password': dump_db_service_password, 'database': dump_db_service_name} | to_json }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Prove service-account network access using a disposable probe container in the app network namespace
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --read-only
              - --user
              - "0"
              - --network
              - "container:{{ dump_db_service_container }}"
              - --volume
              - "{{ dump_db_service_probe_script_host }}:/run/db-probe.js:ro"
              - --volume
              - "{{ dump_db_service_probe_config_host }}:/run/db-probe.json:ro"
              - --entrypoint
              - node
              - "{{ dump_db_service_probe_image_id }}"
              - /run/db-probe.js
              - /run/db-probe.json
          register: dump_db_service_probe
          changed_when: false
          no_log: true
          failed_when: dump_db_service_probe.rc != 0 or 'DB_ENDPOINT_PROBE=PASS read_only=true super_read_only=true' not in dump_db_service_probe.stdout

      always:
        - name: Remove probe credential and script from host tmpfs
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ dump_db_service_probe_config_host }}"
            - "{{ dump_db_service_probe_script_host }}"
          no_log: true

    - name: Switch app DB endpoint while preserving the previous container for pre-DNS rollback
      when: dump_db_service_cutover_phase == 'switch'
      block:
        - name: Confirm the snapshot exists and the old container has not already been moved
          ansible.builtin.stat:
            path: "{{ dump_db_service_cutover_root }}/{{ dump_db_service_cutover_id }}/app.env.before"
          register: dump_db_service_old_env_stat

        - name: Require a completed secure pre-switch snapshot
          ansible.builtin.assert:
            that:
              - dump_db_service_old_env_stat.stat.exists
              - dump_db_service_old_env_stat.stat.isreg
              - dump_db_service_old_env_stat.stat.pw_name == 'root'
              - dump_db_service_old_env_stat.stat.mode == '0600'
            fail_msg: Secure app configuration snapshot is missing or unsafe.

        - name: Load the non-secret original container image identity
          ansible.builtin.slurp:
            src: "{{ dump_db_service_cutover_root }}/{{ dump_db_service_cutover_id }}/container.json"
          register: dump_db_service_container_metadata
          no_log: true

        - name: Parse original container metadata
          ansible.builtin.set_fact:
            dump_db_service_old_metadata: "{{ dump_db_service_container_metadata.content | b64decode | from_json }}"
          no_log: true

        - name: Preserve the original container as the pre-DNS rollback copy
          ansible.builtin.command:
            argv:
              - docker
              - rename
              - "{{ dump_db_service_container }}"
              - "{{ dump_db_service_old_metadata.rollback_container }}"
          no_log: true

        - name: Stop the preserved original container without deleting it
          ansible.builtin.command:
            argv:
              - docker
              - stop
              - --time
              - "10"
              - "{{ dump_db_service_old_metadata.rollback_container }}"
          no_log: true

        - name: Change only DB_HOST to the verified isolated private IP
          ansible.builtin.lineinfile:
            path: "{{ dump_db_service_env_file }}"
            regexp: '^DB_HOST='
            line: "DB_HOST={{ dump_db_service_host }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Change only DB_PORT to the private service listener port
          ansible.builtin.lineinfile:
            path: "{{ dump_db_service_env_file }}"
            regexp: '^DB_PORT='
            line: "DB_PORT={{ dump_db_service_port }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Use the isolated least-privilege application account
          ansible.builtin.lineinfile:
            path: "{{ dump_db_service_env_file }}"
            regexp: '^DB_USER='
            line: "DB_USER={{ dump_db_service_user }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Install the isolated service credential without logging its value
          ansible.builtin.lineinfile:
            path: "{{ dump_db_service_env_file }}"
            regexp: '^DB_PASSWORD='
            line: "DB_PASSWORD={{ dump_db_service_password }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Recreate the Web or EMR app with its original image and the new protected env file
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --detach
              - --name
              - "{{ dump_db_service_container }}"
              - --restart
              - unless-stopped
              - --publish
              - IP_REDACTED:3000:3000
              - --label
              - "hospital-dr.db-cutover-id={{ dump_db_service_cutover_id }}"
              - --env-file
              - "{{ dump_db_service_env_file }}"
              - "{{ dump_db_service_old_metadata.image_id }}"
          register: dump_db_service_new_container
          no_log: true

        - name: Wait for the new app container healthcheck
          ansible.builtin.shell: |
            set -eu
            for attempt in $(seq 1 30); do
              health="$(docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' "{{ dump_db_service_container }}" 2>/dev/null || true)"
              [ "$health" = healthy ] && exit 0
              sleep 5
            done
            exit 1
          args:
            executable: /bin/bash
          changed_when: false
          no_log: true
        - name: Verify Web DB health using its bodyless Dump health endpoint
          ansible.builtin.uri:
            url: http://IP_REDACTED:3000/__hospital_dr/health
            method: GET
            status_code: 204
            timeout: 10
            return_content: false
          register: dump_db_service_web_health
          retries: 6
          delay: 5
          until: dump_db_service_web_health.status == 204
          no_log: true
          when: dump_db_service_app_kind == 'web'

        - name: Verify EMR DB health using its bodyless Dump health endpoint
          ansible.builtin.uri:
            url: http://IP_REDACTED:3000/__hospital_dr/health
            method: GET
            status_code: 204
            timeout: 10
            return_content: false
          register: dump_db_service_emr_health
          retries: 6
          delay: 5
          until: dump_db_service_emr_health.status == 204
          no_log: true
          when: dump_db_service_app_kind == 'emr'

    - name: Restore the pre-DNS app configuration and original container
      when: dump_db_service_cutover_phase == 'rollback'
      block:
        - name: Inspect the protected env backup
          ansible.builtin.stat:
            path: "{{ dump_db_service_cutover_root }}/{{ dump_db_service_cutover_id }}/app.env.before"
            follow: false
          register: dump_db_service_rollback_env_stat

        - name: Require a valid rollback snapshot
          ansible.builtin.assert:
            that:
              - dump_db_service_rollback_env_stat.stat.exists
              - dump_db_service_rollback_env_stat.stat.isreg
              - not dump_db_service_rollback_env_stat.stat.islnk
              - dump_db_service_rollback_env_stat.stat.pw_name == 'root'
              - dump_db_service_rollback_env_stat.stat.mode == '0600'
            fail_msg: Cannot safely roll back without the root-only original app env snapshot.

        - name: Load original container rollback metadata
          ansible.builtin.slurp:
            src: "{{ dump_db_service_cutover_root }}/{{ dump_db_service_cutover_id }}/container.json"
          register: dump_db_service_rollback_metadata_blob
          no_log: true

        - name: Parse rollback metadata
          ansible.builtin.set_fact:
            dump_db_service_rollback_metadata: "{{ dump_db_service_rollback_metadata_blob.content | b64decode | from_json }}"
          no_log: true

        - name: Restore the exact previous app DB environment file
          ansible.builtin.copy:
            src: "{{ dump_db_service_cutover_root }}/{{ dump_db_service_cutover_id }}/app.env.before"
            dest: "{{ dump_db_service_env_file }}"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Check whether the original preserved container exists
          ansible.builtin.command:
            argv:
              - docker
              - container
              - inspect
              - "{{ dump_db_service_rollback_metadata.rollback_container }}"
          register: dump_db_service_rollback_container_check
          changed_when: false
          failed_when: false
          no_log: true

        - name: Verify the preserved container is the exact original container
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --format
              - "{% raw %}{{.Id}}{% endraw %}"
              - "{{ dump_db_service_rollback_metadata.rollback_container }}"
          register: dump_db_service_preserved_container_id
          changed_when: false
          failed_when: false
          no_log: true

        - name: Refuse to restore or delete an unexpected preserved container
          ansible.builtin.assert:
            that:
              - dump_db_service_rollback_container_check.rc != 0 or dump_db_service_preserved_container_id.stdout == dump_db_service_rollback_metadata.container_id
            fail_msg: The named rollback container does not match this cutover's recorded original container.
          no_log: true

        - name: Restore the previous container if the switch had started
          when: dump_db_service_rollback_container_check.rc == 0
          block:
            - name: Remove only the newly named app container
              block:
                - name: Inspect the current named app container's cutover label
                  ansible.builtin.command:
                    argv:
                      - docker
                      - inspect
                      - --format
                      - "{% raw %}{{index .Config.Labels \"hospital-dr.db-cutover-id\"}}{% endraw %}"
                      - "{{ dump_db_service_container }}"
                  register: dump_db_service_current_label
                  changed_when: false
                  failed_when: false
                  no_log: true

                - name: Refuse to remove an app container not created by this cutover
                  ansible.builtin.assert:
                    that:
                      - dump_db_service_current_label.rc != 0 or dump_db_service_current_label.stdout == dump_db_service_cutover_id
                    fail_msg: Refusing to remove a container that does not carry this cutover ID.
                  no_log: true

                - name: Remove only this cutover's new app container
                  ansible.builtin.command:
                    argv:
                      - docker
                      - rm
                      - --force
                      - "{{ dump_db_service_container }}"
                  when: dump_db_service_current_label.rc == 0
                  no_log: true

            - name: Rename the preserved original container back to its service name
              ansible.builtin.command:
                argv:
                  - docker
                  - rename
                  - "{{ dump_db_service_rollback_metadata.rollback_container }}"
                  - "{{ dump_db_service_container }}"
              no_log: true

            - name: Start the original container if it is stopped
              ansible.builtin.shell: |
                set -eu
                running="$(docker inspect --format '{% raw %}{{.State.Running}}{% endraw %}' "{{ dump_db_service_container }}")"
                [ "$running" = true ] || docker start "{{ dump_db_service_container }}" >/dev/null
              args:
                executable: /bin/bash
              changed_when: false
              no_log: true

        - name: Verify an untouched original container remains when switch never reached this host
          when: dump_db_service_rollback_container_check.rc != 0
          block:
            - name: Read the untouched container ID
              ansible.builtin.command:
                argv:
                  - docker
                  - inspect
                  - --format
                  - "{% raw %}{{.Id}}{% endraw %}"
                  - "{{ dump_db_service_container }}"
              register: dump_db_service_untouched_container_id
              changed_when: false
              failed_when: false
              no_log: true

            - name: Require that the untouched container is still the exact original
              ansible.builtin.assert:
                that:
                  - dump_db_service_untouched_container_id.rc == 0
                  - dump_db_service_untouched_container_id.stdout == dump_db_service_rollback_metadata.container_id
                fail_msg: The original container is missing or changed; rollback is unsafe.
              no_log: true

        - name: Verify restored app container health
          ansible.builtin.shell: |
            set -eu
            for attempt in $(seq 1 30); do
              health="$(docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' "{{ dump_db_service_container }}" 2>/dev/null || true)"
              [ "$health" = healthy ] && exit 0
              sleep 5
            done
            exit 1
          args:
            executable: /bin/bash
          changed_when: false
          no_log: true
