<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>환자 상세 — EMR</title>
<link rel="stylesheet" href="css/style.css">
<style>
.patient-header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
}
.patient-avatar {
  width: 56px; height: 56px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-dim), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  font-weight: 300;
  color: #fff;
  flex-shrink: 0;
}
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border-lit);
  border-radius: 12px;
  padding: 28px 30px;
  width: 520px;
  max-width: 95vw;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 20px; display:flex; align-items:center; justify-content:space-between; }
.edit-fields { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <div class="main">
    <div class="topbar">
      <a href="patients.html" class="btn btn-ghost btn-sm" style="margin-right:4px;">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        목록
      </a>
      <div class="topbar-title" id="topbar-name">환자 상세</div>
      <button class="btn btn-ghost btn-sm" onclick="openEdit()">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        정보 수정
      </button>
    </div>

    <div class="content" id="main-content">
      <div class="text-dim text-mono" style="padding:40px;text-align:center;">환자 정보를 불러오는 중...</div>
    </div>
  </div>
</div>

<!-- 수정 모달 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">
      환자 정보 수정
      <button onclick="closeEdit()" style="background:none;border:none;color:var(--text-3);cursor:pointer;padding:2px;">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="edit-fields">
      <div class="form-group form-full">
        <label class="form-label">성명 <span class="req">*</span></label>
        <input id="edit-name" class="form-control" type="text">
      </div>
      <div class="form-group">
        <label class="form-label">생년월일 <span class="req">*</span></label>
        <input id="edit-birth" class="form-control" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">성별 <span class="req">*</span></label>
        <select id="edit-gender" class="form-control">
          <option value="M">남성 (M)</option>
          <option value="F">여성 (F)</option>
        </select>
      </div>
      <div class="form-group form-full">
        <label class="form-label">연락처</label>
        <input id="edit-phone" class="form-control" type="tel" placeholder="010-0000-0000">
      </div>
    </div>
    <div class="flex gap-8 mt-16" style="justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="closeEdit()">취소</button>
      <button class="btn btn-primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<!-- 진료기록 추가 모달 -->
<div class="modal-overlay" id="recordModal">
  <div class="modal">
    <div class="modal-title">
      진료 기록 추가
      <button onclick="closeRecord()" style="background:none;border:none;color:var(--text-3);cursor:pointer;padding:2px;">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="form-group">
        <label class="form-label">진료일 <span class="req">*</span></label>
        <input id="rec-date" class="form-control" type="datetime-local">
      </div>
      <div class="form-group">
        <label class="form-label">담당 의사</label>
        <select id="rec-doctor" class="form-control">
          <option>이준영 (내과)</option>
          <option>최다은 (정형외과)</option>
          <option>박민수 (신경과)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">진단 내용 <span class="req">*</span></label>
        <textarea id="rec-diagnosis" class="form-control" rows="5" placeholder="주호소, 진단명, 처치 내용 등을 입력하세요..."></textarea>
      </div>
    </div>
    <div class="flex gap-8 mt-16" style="justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="closeRecord()">취소</button>
      <button class="btn btn-primary" onclick="saveRecord()">저장</button>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/patients.js"></script>
<script src="js/medical-records.js"></script>
<script>
const user = getUser();
renderSidebar('patients');

const params = new URLSearchParams(location.search);
const pid = parseInt(params.get('id'));

let patient = null;
let recordsList = [];

async function loadData() {
  if (!pid) {
    document.getElementById('main-content').innerHTML = '<div class="text-dim text-mono" style="padding:40px;text-align:center;">잘못된 접근입니다.</div>';
    return;
  }

  // API에서 데이터 가져오기
  patient = await fetchPatientDetail(pid);
  if (!patient) {
    document.getElementById('main-content').innerHTML = '<div class="text-dim text-mono" style="padding:40px;text-align:center;">환자 정보를 찾을 수 없습니다.</div>';
    return;
  }

  recordsList = await fetchMedicalRecords(pid);
  renderPage();
}

function renderPage() {
  document.getElementById('topbar-name').textContent = patient.name + ' 환자';
  document.getElementById('main-content').innerHTML = `
    <div class="patient-header">
      <div class="patient-avatar">${patient.name[0]}</div>
      <div>
        <div style="font-size:20px;font-weight:500;">${patient.name}
          <span class="badge ${patient.gender==='M'?'badge-blue':'badge-warn'}" style="margin-left:8px;vertical-align:middle;">${patient.gender==='M'?'남':'여'}</span>
        </div>
        <div class="text-dim text-mono fs-12 mt-4">P-${String(patient.patient_id).padStart(5,'0')} · ${patient.birth_date} · ${age(patient.birth_date)}</div>
      </div>
      <div class="ml-auto">
        ${user && user.role === 'DOC' ? `<button class="btn btn-primary btn-sm" onclick="openRecord()">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          진료기록 추가
        </button>` : ''}
      </div>
    </div>

    <!-- 기본 정보 -->
    <div class="card">
      <div class="card-title">기본 정보</div>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-key">성명</div>
          <div class="info-val fw-500">${patient.name}</div>
        </div>
        <div class="info-item">
          <div class="info-key">성별</div>
          <div class="info-val">${patient.gender === 'M' ? '남성' : '여성'}</div>
        </div>
        <div class="info-item">
          <div class="info-key">생년월일</div>
          <div class="info-val text-mono">${patient.birth_date}</div>
        </div>
        <div class="info-item">
          <div class="info-key">나이</div>
          <div class="info-val">${age(patient.birth_date)}</div>
        </div>
        <div class="info-item">
          <div class="info-key">연락처</div>
          <div class="info-val">${patient.phone || '—'}</div>
        </div>
        <div class="info-item">
          <div class="info-key">환자 ID</div>
          <div class="info-val text-mono text-dim">P-${String(patient.patient_id).padStart(5,'0')}</div>
        </div>
      </div>
    </div>

    <!-- 진료 기록 -->
    <div class="card">
      <div class="card-title">진료 기록 <span class="badge badge-gray" style="margin-left:6px;">${recordsList.length}건</span></div>
      <div class="timeline" id="records-timeline">
        ${renderRecords()}
      </div>
    </div>
  `;
}

function renderRecords() {
  if (!recordsList.length) return `<div class="text-dim fs-13" style="padding:16px 0;">진료 기록이 없습니다.</div>`;
  // 이미 백엔드에서 최신순으로 정렬되어 넘어옵니다
  return recordsList.map(r => `
    <div class="tl-item">
      <div class="tl-dot"></div>
      <div class="tl-meta">${fmtDateTime(r.visit_date)}</div>
      <div class="tl-card">
        <div style="white-space:pre-line;font-size:13.5px;line-height:1.7;">${r.diagnosis}</div>
        <div class="tl-doctor">담당: ${r.doctor || '—'} (${r.dept || '—'})</div>
      </div>
    </div>
  `).join('');
}

// ── 수정 모달 ──
function openEdit() {
  if (!patient) return;
  document.getElementById('edit-name').value  = patient.name;
  document.getElementById('edit-birth').value = patient.birth_date;
  document.getElementById('edit-gender').value = patient.gender;
  document.getElementById('edit-phone').value = patient.phone || '';
  document.getElementById('editModal').classList.add('open');
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('open');
}

async function saveEdit() {
  const updateData = {
    name: document.getElementById('edit-name').value.trim(),
    birth_date: document.getElementById('edit-birth').value,
    gender: document.getElementById('edit-gender').value,
    phone: document.getElementById('edit-phone').value
  };

  if (!updateData.name || !updateData.birth_date || !updateData.gender) {
    alert('필수 입력 항목(이름, 생년월일, 성별)을 확인해주세요.');
    return;
  }

  try {
    const res = await updatePatient(pid, updateData);
    if (res.success) {
      closeEdit();
      loadData(); // 정보 갱신 후 리렌더링
    }
  } catch (error) {
    alert(error.message || '환자 정보 수정에 실패했습니다.');
  }
}

// ── 진료기록 모달 ──
function openRecord() {
  const now = new Date();
  // 로컬 시간 기준으로 'YYYY-MM-DDTHH:mm' 포맷 생성
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('rec-date').value = now.toISOString().slice(0,16);
  document.getElementById('rec-diagnosis').value = '';
  document.getElementById('recordModal').classList.add('open');
}

function closeRecord() {
  document.getElementById('recordModal').classList.remove('open');
}

async function saveRecord() {
  const diag = document.getElementById('rec-diagnosis').value.trim();
  if (!diag) { alert('진단 내용을 입력해주세요.'); return; }

  const doctorStr = document.getElementById('rec-doctor').value;
  const [dname, ddept] = doctorStr.replace(')', '').split(' (');

  const recordData = {
    patient_id: pid,
    visit_date: document.getElementById('rec-date').value,
    diagnosis: diag,
    doctor: dname,
    dept: ddept || ''
  };

  try {
    const res = await addMedicalRecord(recordData);
    if (res.success) {
      closeRecord();
      loadData(); // 새로운 진료기록 갱신 후 리렌더링
    }
  } catch (error) {
    alert(error.message || '진료 기록 추가에 실패했습니다.');
  }
}

// 모달 바깥 클릭 닫기
document.getElementById('editModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeEdit(); });
document.getElementById('recordModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeRecord(); });

loadData();
</script>
</body>
</html>
