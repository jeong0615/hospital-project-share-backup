---
- name: "Validate DR database secrets / DR 데이터베이스 secret 검증"
  assert:
    that:
      - lookup('env', 'MYSQL_ROOT_PASS') | length > 0
      - lookup('env', 'WEB_DB_PASSWORD') | length > 0
      - lookup('env', 'DOC_DB_PASSWORD') | length > 0
    fail_msg: "Missing required secrets: MYSQL_ROOT_PASS, WEB_DB_PASSWORD, DOC_DB_PASSWORD. Set them in /etc/hospital-dr/dr.env."
  no_log: true

- name: "Install MySQL server and client packages / MySQL 서버 및 클라이언트 패키지 설치"
  apt:
    name: ['mysql-server', 'mysql-client']
    state: present
    update_cache: yes

- name: "Configure MySQL listener for DR network access / DR 네트워크 접근을 위한 MySQL 리스너 구성"
  lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address'
    line: 'bind-address = IP_REDACTED'

- name: "Ensure MySQL remote administrative access for DR validation / DR 검증용 MySQL 원격 관리자 접근 구성"
  shell: |
    mysql_defaults_file=$(mktemp)
    cleanup_mysql_defaults() { rm -f "$mysql_defaults_file"; }
    trap cleanup_mysql_defaults EXIT
    chmod 600 "$mysql_defaults_file"
    {
      printf '[client]\n'
      printf 'user=root\n'
      printf 'password=%s\n' "$MYSQL_ROOT_PASS"
    } > "$mysql_defaults_file"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '${MYSQL_ROOT_PASS}';"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "ALTER USER 'root'@'%' IDENTIFIED BY '${MYSQL_ROOT_PASS}';"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "CREATE USER IF NOT EXISTS 'root'@'10.20.10.%' IDENTIFIED BY '${WEB_DB_PASSWORD}';"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "ALTER USER 'root'@'10.20.10.%' IDENTIFIED BY '${WEB_DB_PASSWORD}';"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "GRANT ALL PRIVILEGES ON *.* TO 'root'@'10.20.10.%' WITH GRANT OPTION;"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "CREATE USER IF NOT EXISTS 'root'@'10.20.20.%' IDENTIFIED BY '${DOC_DB_PASSWORD}';"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "ALTER USER 'root'@'10.20.20.%' IDENTIFIED BY '${DOC_DB_PASSWORD}';"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "GRANT ALL PRIVILEGES ON *.* TO 'root'@'10.20.20.%' WITH GRANT OPTION;"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "FLUSH PRIVILEGES;"
  environment:
    MYSQL_ROOT_PASS: "{{ lookup('env', 'MYSQL_ROOT_PASS') }}"
    WEB_DB_PASSWORD: "{{ lookup('env', 'WEB_DB_PASSWORD') }}"
    DOC_DB_PASSWORD: "{{ lookup('env', 'DOC_DB_PASSWORD') }}"
  no_log: true
  ignore_errors: yes

- name: "Restart MySQL to apply network configuration / 네트워크 설정 적용을 위한 MySQL 재시작"
  service:
    name: mysql
    state: restarted

- name: "Create DR database working directories / DR 데이터베이스 작업 디렉토리 생성"
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: ubuntu
    group: ubuntu
  with_items:
    - "/home/ubuntu/scripts"
    - "/home/ubuntu/db_backups"

- name: "Deploy database restore script / 데이터베이스 복구 스크립트 배포"
  copy:
    src: db_restore.sh
    dest: /home/ubuntu/scripts/db_restore.sh
    mode: '0755'

- name: "Deploy database replication configuration script / 데이터베이스 Replication 구성 스크립트 배포"
  copy:
    src: db_replication_configure.sh
    dest: /home/ubuntu/scripts/db_replication_configure.sh
    mode: '0755'

- name: "Deploy database replication health check script / 데이터베이스 Replication 상태 점검 스크립트 배포"
  copy:
    src: db_replication_check.sh
    dest: /home/ubuntu/scripts/db_replication_check.sh
    mode: '0755'

- name: "Deploy database promotion script / 데이터베이스 DR 승격 스크립트 배포"
  copy:
    src: db_promote_dr.sh
    dest: /home/ubuntu/scripts/db_promote_dr.sh
    mode: '0755'

- name: "Deploy baseline hospital database schema / 병원 기본 데이터베이스 스키마 배포"
  copy:
    src: hospital_schema.sql
    dest: /home/ubuntu/scripts/hospital_schema.sql
    mode: '0644'

- name: "Stage encrypted database backup artifacts / 암호화된 데이터베이스 백업 파일 배치"
  copy:
    src: "{{ item }}"
    dest: /home/ubuntu/db_backups/
  with_fileglob:
    - "/var/lib/hospital-dr/db_backups/*.enc"
  when: lookup('env', 'DB_BACKUP_ENCRYPTION_KEY') | length > 0

- name: "Stage database replication coordinate metadata / 데이터베이스 Replication 좌표 메타데이터 배치"
  copy:
    src: "{{ item }}"
    dest: /home/ubuntu/db_backups/
  with_fileglob:
    - "/var/lib/hospital-dr/db_backups/*.master_status"

- name: "Execute database restore workflow / 데이터베이스 복구 워크플로 실행"
  shell: /bin/bash /home/ubuntu/scripts/db_restore.sh
  register: db_res
  environment:
    DB_BACKUP_ENCRYPTION_KEY: "{{ lookup('env', 'DB_BACKUP_ENCRYPTION_KEY') }}"
    DB_BACKUP_FILE: "{{ lookup('env', 'DB_BACKUP_FILE') }}"
  when: lookup('env', 'DB_BACKUP_ENCRYPTION_KEY') | length > 0

- name: "Ensure required hospital database schema is present / 필수 병원 데이터베이스 스키마 적용 확인"
  shell: |
    mysql_defaults_file=$(mktemp)
    cleanup_mysql_defaults() { rm -f "$mysql_defaults_file"; }
    trap cleanup_mysql_defaults EXIT
    chmod 600 "$mysql_defaults_file"
    {
      printf '[client]\n'
      printf 'user=root\n'
      printf 'password=%s\n' "$MYSQL_ROOT_PASS"
    } > "$mysql_defaults_file"
    mysql --defaults-extra-file="$mysql_defaults_file" < /home/ubuntu/scripts/hospital_schema.sql
  environment:
    MYSQL_ROOT_PASS: "{{ lookup('env', 'MYSQL_ROOT_PASS') }}"
  no_log: true

- name: "Ensure database access for the DR web tier / DR Web 계층의 데이터베이스 접근 권한 구성"
  shell: |
    mysql_defaults_file=$(mktemp)
    cleanup_mysql_defaults() { rm -f "$mysql_defaults_file"; }
    trap cleanup_mysql_defaults EXIT
    chmod 600 "$mysql_defaults_file"
    {
      printf '[client]\n'
      printf 'user=root\n'
      printf 'password=%s\n' "$MYSQL_ROOT_PASS"
    } > "$mysql_defaults_file"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "CREATE USER IF NOT EXISTS 'root'@'10.20.10.%' IDENTIFIED WITH mysql_native_password BY '${WEB_DB_PASSWORD}';"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "ALTER USER 'root'@'10.20.10.%' IDENTIFIED WITH mysql_native_password BY '${WEB_DB_PASSWORD}';"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "GRANT ALL PRIVILEGES ON *.* TO 'root'@'10.20.10.%' WITH GRANT OPTION;"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "CREATE USER IF NOT EXISTS 'root'@'10.20.20.%' IDENTIFIED WITH mysql_native_password BY '${DOC_DB_PASSWORD}';"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "ALTER USER 'root'@'10.20.20.%' IDENTIFIED WITH mysql_native_password BY '${DOC_DB_PASSWORD}';"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "GRANT ALL PRIVILEGES ON *.* TO 'root'@'10.20.20.%' WITH GRANT OPTION;"
    mysql --defaults-extra-file="$mysql_defaults_file" -e "FLUSH PRIVILEGES;"
  environment:
    MYSQL_ROOT_PASS: "{{ lookup('env', 'MYSQL_ROOT_PASS') }}"
    WEB_DB_PASSWORD: "{{ lookup('env', 'WEB_DB_PASSWORD') }}"
    DOC_DB_PASSWORD: "{{ lookup('env', 'DOC_DB_PASSWORD') }}"
  no_log: true

- name: "Configure Native Replication from on-premise source / 온프레미스 원본 DB Native Replication 구성"
  shell: /bin/bash /home/ubuntu/scripts/db_replication_configure.sh
  environment:
    MYSQL_ROOT_PASS: "{{ lookup('env', 'MYSQL_ROOT_PASS') }}"
    TARGET_DB: "{{ lookup('env', 'TARGET_DB') | default('hospital_db', true) }}"
    DB_SOURCE_HOST: "{{ lookup('env', 'DB_SOURCE_HOST') }}"
    DB_SOURCE_PORT: "{{ lookup('env', 'DB_SOURCE_PORT') | default('3306', true) }}"
    DB_REPL_USER: "{{ lookup('env', 'DB_REPL_USER') | default('repl', true) }}"
    DB_REPL_PASSWORD: "{{ lookup('env', 'DB_REPL_PASSWORD') }}"
    DB_REPL_SERVER_ID: "{{ lookup('env', 'DB_REPL_SERVER_ID') | default('20', true) }}"
    DB_REPL_MODE: "{{ lookup('env', 'DB_REPL_MODE') | default('position', true) }}"
    DB_SOURCE_LOG_FILE: "{{ lookup('env', 'DB_SOURCE_LOG_FILE') }}"
    DB_SOURCE_LOG_POS: "{{ lookup('env', 'DB_SOURCE_LOG_POS') }}"
    BACKUP_DIR: "/home/ubuntu/db_backups"
  when: lookup('env', 'DB_NR_ENABLED') | lower == 'true'
  no_log: true

- name: "Validate Native Replication health / Native Replication 상태 검증"
  shell: /bin/bash /home/ubuntu/scripts/db_replication_check.sh
  environment:
    MYSQL_ROOT_PASS: "{{ lookup('env', 'MYSQL_ROOT_PASS') }}"
  when: lookup('env', 'DB_NR_ENABLED') | lower == 'true'

- name: "Promote DR database for failover writes / 페일오버 쓰기 처리를 위한 DR DB 승격"
  shell: /bin/bash /home/ubuntu/scripts/db_promote_dr.sh
  environment:
    MYSQL_ROOT_PASS: "{{ lookup('env', 'MYSQL_ROOT_PASS') }}"
  when: lookup('env', 'DB_PROMOTE_ON_FAILOVER') | lower == 'true'

- name: "Enable and start MySQL service / MySQL 서비스 활성화 및 시작"
  service:
    name: mysql
    state: started
    enabled: yes
